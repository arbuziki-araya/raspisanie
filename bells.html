<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon-192.png">
<title>Звонки</title>
<style>
:root{color-scheme:light;--acc:#3b5bdb;--mute:#8a8a8e}
*{box-sizing:border-box}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f5f1;color:#1d1d1f;padding:20px 16px;max-width:640px;margin:0 auto}
h1{font-size:26px;margin:4px 0 12px}a{color:var(--mute);font-size:14px;text-decoration:none}
.tabs{display:flex;background:#ebe9e3;border-radius:12px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:7px 0;border-radius:9px;font:inherit;font-size:14px;color:var(--mute);cursor:pointer;transition:all .2s}
.tabs button.on{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px #0002}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 16px;opacity:0;animation:in .35s ease forwards}
.row b{color:var(--acc);min-width:64px}
.row .tm{margin-left:auto;font-weight:600}
.row .d{font-size:12px;color:var(--mute);min-width:52px;text-align:right}
.row.ev{background:#ecebe6}.row.ev b{color:#55555a}
.row.now{outline:2px solid var(--acc)}
.brk{font-size:12px;color:var(--mute);text-align:center;padding:4px 0;opacity:0;animation:in .35s ease forwards}
@keyframes in{from{transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<a href="index.html">← Расписание</a>
<h1>Звонки</h1>
<div class="tabs" id="tabs"></div>
<div id="b"></div>
<script src="schedule.js"></script>
<script>
const NAMES=["","Пн","Вт","Ср","Чт","Пт","Сб"];
const min=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=new Date();const todayD=now.getDay();
let day=todayD===0?1:todayD;

function render(){
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  for(let d=1;d<=6;d++){
    const b=document.createElement("button");b.textContent=NAMES[d];
    if(d===day)b.className="on";b.onclick=()=>{day=d;render()};tabs.appendChild(b);
  }
  const box=document.getElementById("b");box.innerHTML="";
  const list=BELLS[day]||[];const cur=now.getHours()*60+now.getMinutes();let k=0;
  list.forEach((it,i)=>{
    if(i>0){
      const gap=min(it.s)-min(list[i-1].e);
      const br=document.createElement("div");br.className="brk";br.style.animationDelay=k++*40+"ms";
      br.textContent=`перемена ${gap} мин`;box.appendChild(br);
    }
    const r=document.createElement("div");r.className="row"+(it.name?" ev":"");
    if(day===todayD&&cur>=min(it.s)&&cur<min(it.e))r.classList.add("now");
    r.style.animationDelay=k++*40+"ms";
    r.innerHTML=`<b>${it.name?esc(it.name):it.p+" пара"}</b><span class="tm">${it.s} – ${it.e}</span><span class="d">${min(it.e)-min(it.s)} мин</span>`;
    box.appendChild(r);
  });
}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
