<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звонки</title>
<style>
:root{color-scheme:light}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f5f1;color:#1d1d1f;padding:20px 16px;max-width:640px;margin:0 auto}
h1{font-size:26px;margin-bottom:14px}a{color:#8a8a8e;font-size:14px;text-decoration:none}
.row{display:flex;justify-content:space-between;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;opacity:0;animation:in .35s ease forwards}
.row b{color:#3b5bdb}
@keyframes in{from{transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<a href="index.html">← Расписание</a>
<h1>Звонки</h1>
<div id="b"></div>
<script src="schedule.js"></script>
<script>
const box=document.getElementById("b");
Object.entries(BELLS).forEach(([p,[s,e]],i)=>{
  const d=document.createElement("div");d.className="row";d.style.animationDelay=i*50+"ms";
  d.innerHTML=`<b>${p} пара</b><span>${s?s+" – "+e:"время не указано"}</span>`;box.appendChild(d);
});
</script>
</body>
</html>
