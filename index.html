<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Расписание 612-Б</title>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--mute:#8a8a8e;--line:#e7e5df;--acc:#3b5bdb;--warn:#e8590c;--warnbg:#fff4e6;--add:#2f9e44;--addbg:#ebfbee}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:20px 16px 60px;max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.week{font-size:13px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--acc);color:#fff;animation:pop .4s ease}
.week.num{background:#2f9e44}
a.small{color:var(--mute);font-size:13px;text-decoration:none}
.bar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.seg{display:flex;background:#ebe9e3;border-radius:12px;padding:3px;position:relative}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font:inherit;font-size:14px;color:var(--mute);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.nav{display:flex;align-items:center;gap:4px}
.nav>button{flex:0 0 32px;height:44px;border:0;background:none;font-size:26px;color:var(--mute);cursor:pointer;border-radius:10px;transition:background .2s}
.nav>button:active{background:#ebe9e3}
.todayBtn{border:0;background:none;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;padding:0 2px;visibility:hidden}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;flex:1;justify-content:space-between;animation:fade .3s}
.days button{position:relative;flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;width:52px;font:inherit;cursor:pointer;transition:transform .15s,background .2s}
.days button.ch::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.days button:active{transform:scale(.94)}
.days button b{display:block;font-size:17px}.days button small{font-size:11px;color:var(--mute)}
.days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.days button.on small{color:#ccc}
.days button.today{border-color:var(--acc)}
.title{font-size:15px;color:var(--mute);margin:8px 2px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:12px;box-shadow:0 1px 2px #0000000d;opacity:0;transform:translateY(10px);animation:in .35s ease forwards}
.card .n{font-size:22px;font-weight:700;color:var(--acc);min-width:22px;line-height:1.1}
.card .t{font-size:11px;color:var(--mute);display:block;font-weight:400}
.card .s{font-weight:600}
.card .m{font-size:13px;color:var(--mute);margin-top:2px}
.card .room{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap;align-self:flex-start;background:#f1f3f5;padding:3px 8px;border-radius:8px}
.tag{white-space:nowrap;font-size:11px;background:#edf2ff;color:var(--acc);padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:2px}
.card.ev{background:#ecebe6;box-shadow:none;padding:9px 14px;align-items:center}
.card.ev .s{font-weight:500;color:#55555a;font-size:14px}
.rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start}
.ln .info{flex:1;min-width:0}
.ln.rep,.ln.add{padding:7px 9px;border-radius:4px 12px 12px 4px}
.ln.rep{background:var(--warnbg);border-left:3px solid var(--warn)}
.ln.add{background:var(--addbg);border-left:3px solid var(--add)}
.ln.rep .room,.ln.add .room{background:#fff}
.rows.hl .ln.same{padding:0 9px 0 12px}
.lbl{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:5px;margin-bottom:3px;color:#fff}
.lbl.rep{background:var(--warn)}.lbl.add{background:var(--add)}
.was{font-size:13px;color:var(--mute);margin-top:3px}
.was s{text-decoration:line-through}
.empty{text-align:center;color:var(--mute);padding:40px 0;animation:fade .4s}
.note{font-size:13px;background:var(--warnbg);border-radius:12px;padding:10px 12px;margin-bottom:10px;animation:fade .4s}
.note b{color:var(--warn)}
.raw{font-size:13px;margin-top:4px;white-space:pre-wrap}
footer{margin-top:24px;font-size:12px;color:var(--mute);text-align:center}
@keyframes in{to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
</style>
</head>
<body>
<header><h1>612-Б</h1><span id="week" class="week"></span></header>
<div class="bar">
  <div class="seg" id="sg">
    <button data-v="1">1 подгруппа</button><button data-v="2">2 подгруппа</button><button data-v="0">Обе</button>
  </div>
  <a class="small" href="bells.html" style="margin-left:auto;align-self:center">🔔 Звонки</a>
</div>
<div class="nav">
  <button id="prev" aria-label="Предыдущая неделя">‹</button>
  <div class="days" id="days"></div>
  <button id="next" aria-label="Следующая неделя">›</button>
</div>
<button id="todayBtn" class="todayBtn">Сегодня</button>
<div class="title" id="title"></div>
<div id="notes"></div>
<div class="list" id="list"></div>
<footer id="foot"></footer>

<script src="schedule.js"></script>
<script>
const DAYS=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const DAYS_FULL=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const $=id=>document.getElementById(id);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=new Date();today.setHours(0,0,0,0);

let subgroup=+(localStorage.getItem("sg")??1);
let selected=new Date(today);
if(selected.getDay()===0)selected.setDate(selected.getDate()+1);
let changes=null;
let offline=false; // true, если замены взяты из сохранённой копии (service worker помечает такой ответ)

function weekType(d){
  const base=new Date(BASE_MONDAY+"T00:00:00");
  const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const weeks=Math.round((mon-base)/(7*864e5));
  const same=((weeks%2)+2)%2===0;
  return same?BASE_TYPE:(BASE_TYPE==="num"?"den":"num");
}

function changesFor(d){
  if(!changes)return null;
  for(const f of Object.values(changes.files||{}))
    if(f.ok&&f.date===iso(d))return f.entries;
  return null;
}

/* ==== замены: разбор и сопоставление с расписанием (чистая логика, без DOM) ==== */
const norm=s=>String(s||"").toLowerCase().replace(/ё/g,"е").replace(/\(зам\)/g,"").replace(/[\s.\-–—\/()]/g,"");
const TEACHER_RE=/^[А-ЯЁ][а-яё-]+\s+[А-ЯЁ]\.\s?(?:[А-ЯЁ]\.)?/;
const ROOM_RE=/^(?:(?:к\s*\/\s*к\s*\d+|\d{2,3}[а-я]?|спортзал|чит\.?\s*зал)(?:\s*[\/,]\s*)?)+$/i;
const SG_RE=/\s*\(\s*([12])\s*(?:п\/?г\.?|подгр(?:уппа)?\.?)?\s*\)|\s*\b([12])\s*(?:п\/?г\.?|подгр(?:уппа)?\.?)(?=\s|$|[,;)])/i;

const isTeacher=l=>TEACHER_RE.test(l)||/^вакансия$/i.test(l);
const isNone=l=>!!l&&/^нет$/i.test(l.subj||"");   // «Нет» в колонке «замена» — пары не будет
// в ячейке несколько строк (по подгруппам): берём n-ю, а если строка одна — она общая для всех
const nth=(a,i,n)=>a.length===n?a[i]:a.length===1?a[0]:a.join(" / ");

// Текст замены — ячейки таблицы через « | », а внутри ячейки подгруппы идут отдельными строками (\n):
//   «ТСИ (1)\nМДК.01.01 (2) | Каневский\nКириллова | МДК.04.01 (1)\nТСИ (2) | Ромашкова\nКаневский | 403\nк/к3»
//   = было [предметы | преподаватели], стало [предметы | преподаватели | кабинеты]; n-я строка каждой ячейки — одна подгруппа.
// Если наборов два, первый — что было по файлу колледжа, последний — что стало.
// Результат: список {sg, now:{subj,teacher,room}, old:null|{...}, moved:null|N} — по записи на подгруппу.
function parseChange(text){
  const sets=[];let moved=null;
  for(const c of String(text||"").split("|").map(s=>s.trim()).filter(Boolean)){
    const mv=c.match(/^перенос\s+с\s+(\d+)\s*пар/i);          // «Перенос с 4 пары»
    if(mv){moved=+mv[1];continue}
    if(/^по\s+замене$/i.test(c))continue;
    const lines=c.split("\n").map(s=>s.trim()).filter(Boolean);
    const cur=sets[sets.length-1];
    if(cur&&!cur.teacher.length&&lines.every(isTeacher)){cur.teacher=lines;continue}
    if(cur&&!cur.room.length&&lines.every(l=>ROOM_RE.test(l))){cur.room=lines;continue}
    sets.push({subj:lines,teacher:[],room:[]});
  }
  if(!sets.length)return[{sg:null,now:{subj:String(text||"").trim(),teacher:"",room:""},old:null,moved}];
  const mk=(s,i)=>{
    const m=s.subj[i].match(SG_RE);
    return{subj:s.subj[i].replace(SG_RE,"").trim(),teacher:nth(s.teacher,i,s.subj.length),room:nth(s.room,i,s.subj.length),sg:m?+(m[1]||m[2]):null};
  };
  const last=sets[sets.length-1];
  const now=last.subj.map((_,i)=>mk(last,i));
  const was=sets.length>1?sets[0].subj.map((_,i)=>mk(sets[0],i)):[];
  return now.map((n,i)=>{
    const o=was.find(w=>n.sg&&w.sg===n.sg)||(was.length===now.length?was[i]:was.length===1?was[0]:null)||null;
    return{sg:n.sg||(o&&o.sg)||null,now:n,old:o,moved};
  });
}

const lkey=l=>norm(l.subj)+"|"+norm(l.teacher)+"|"+norm(l.room);
// «МДК.01.01» и «МДК.01.01 Операционные системы» — один предмет
const sameSubj=(a,b)=>{a=norm(a);b=norm(b);return !!a&&!!b&&(a===b||a.startsWith(b)||b.startsWith(a))};

// Итог по паре для одной подгруппы s (1 или 2):
// same — пара как в расписании, rep — заменена (есть что было), add — подстановка (раньше пары не было)
function resolveFor(base,chs,s){
  const b=base.filter(l=>!l.sg||l.sg===s),c=chs.filter(e=>!e.sg||e.sg===s);
  if(!c.length)return b.map(l=>({kind:"same",l}));
  const left=b.slice(),rows=[],reps=[];
  c.forEach(e=>{
    const i=left.findIndex(l=>lkey(l)===lkey(e.now));   // замена совпала с расписанием — не выделяем
    if(i>=0)rows.push({kind:"same",l:left.splice(i,1)[0]});else reps.push(e);
  });
  reps.forEach(e=>{
    let k=e.old?left.findIndex(l=>sameSubj(l.subj,e.old.subj)):-1;       // что именно заменили
    if(k<0&&left.length&&!e.syn)k=0;
    if(e.syn&&k<0)return;                                                 // перенос: такой пары у этой подгруппы не было
    const o=k>=0?left.splice(k,1)[0]:(e.old||null);
    if(isNone(e.now)&&!o)return;                                          // «Нет», а пары и не было — показывать нечего
    rows.push({kind:o?"rep":"add",l:e.now,old:o,moved:e.moved,movedTo:e.movedTo});
  });
  left.forEach(l=>rows.push({kind:"same",l}));
  return rows;
}

// view: 1 или 2 — одна подгруппа; 0 — обе (если у подгрупп одно и то же, показываем один раз, иначе с метками 1/2 п/г)
function resolvePair(base,chs,view){
  if(view)return resolveFor(base,chs,view);
  const r1=resolveFor(base,chs,1),r2=resolveFor(base,chs,2);
  const sig=r=>r.map(x=>x.kind+"|"+lkey(x.l)).join(";");
  if(sig(r1)===sig(r2))return r1;
  return[...r1.map(x=>({...x,tag:1})),...r2.map(x=>({...x,tag:2}))];
}

function computeDay(d){
  const slots=SCHEDULE[d.getDay()]||{};const wt=weekType(d);
  const byPair={},loose=[];
  (changesFor(d)||[]).forEach(e=>{
    const pes=parseChange(e.text);
    if(e.pairs&&e.pairs.length)e.pairs.forEach(p=>(byPair[p]=byPair[p]||[]).push(...pes));
    else if(!subgroup||pes.some(x=>!x.sg||x.sg===subgroup))loose.push(e.text);
  });
  // «Перенос с N пары»: на паре N этот предмет больше не идёт. Если колледж не дал для N отдельной строки — снимаем его сами.
  const explicit=new Set(Object.keys(byPair).map(Number)),extra=[];
  Object.entries(byPair).forEach(([p,list])=>list.forEach(e=>{
    if(e.moved&&e.moved!==+p&&!explicit.has(e.moved))
      extra.push([e.moved,{sg:e.sg,now:{subj:"Нет",teacher:"",room:""},old:e.now,movedTo:+p,syn:true}]);
  }));
  extra.forEach(([p,e])=>(byPair[p]=byPair[p]||[]).push(e));
  const nums=[...new Set([...Object.keys(slots),...Object.keys(byPair)].map(Number))].sort((a,b)=>a-b);
  const items=[];let changed=0;
  nums.forEach(p=>{
    const slot=slots[p];const base=slot?(slot.all||slot[wt]||[]):[];
    const rows=resolvePair(base,byPair[p]||[],subgroup);
    if(!rows.length)return;
    if(rows.some(r=>r.kind!=="same"))changed++;
    items.push({p,rows});
  });
  return{items,loose,changed};
}
/* ==== конец логики замен ==== */

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function bell(p){const b=(BELLS[selected.getDay()]||[]).find(x=>x.p===p);return b?`<span class="t">${b.s}<br>${b.e}</span>`:""}

function render(){
  // недели
  const wt=weekType(selected);const w=$("week");
  w.textContent=wt==="num"?"Числитель":"Знаменатель";w.className="week "+wt;
  // подгруппы
  document.querySelectorAll("#sg button").forEach(b=>b.classList.toggle("on",+b.dataset.v===subgroup));
  // дни: неделя, в которой выбранный день
  const box=$("days");box.innerHTML="";
  const start=new Date(selected);start.setDate(selected.getDate()-((selected.getDay()+6)%7));
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(d.getDay()===0)continue;
    const b=document.createElement("button");
    b.innerHTML=`<small>${DAYS[d.getDay()]}</small><b>${d.getDate()}</b>`;
    if(+d===+selected)b.classList.add("on");
    if(+d===+today)b.classList.add("today");
    if(computeDay(d).changed)b.classList.add("ch");
    b.onclick=()=>{selected=d;render()};
    box.appendChild(b);
  }
  $("todayBtn").style.visibility=+start===+new Date(today.getFullYear(),today.getMonth(),today.getDate()-((today.getDay()+6)%7))?"hidden":"visible";
  const diff=Math.round((selected-today)/864e5);
  const rel=diff===0?"Сегодня, ":diff===1?"Завтра, ":"";
  $("title").textContent=`${rel}${DAYS_FULL[selected.getDay()].toLowerCase()}, ${selected.getDate()} ${MON[selected.getMonth()]}`;

  // замены
  const day=computeDay(selected);
  let notes="";
  if(day.changed||day.loose.length)notes+=`<div class="note"><b>Есть замены на этот день.</b>${day.changed?` <span class="lbl rep">замена</span> — пара заменена, <span class="lbl add">подстановка</span> — пара добавлена.`:""}${day.loose.length?`<div class="raw">${day.loose.map(esc).join("\n")}</div>`:""}</div>`;
  $("notes").innerHTML=notes;

  // пары
  const list=$("list");list.innerHTML="";let i=0;
  const dayBells=BELLS[selected.getDay()]||[];
  const pos=it=>{const i=dayBells.findIndex(b=>it.name?b===it:b.p===it.p);return i<0?100+(it.p||0):i};
  const items=[...day.items];
  if(items.length)dayBells.filter(b=>b.name).forEach(b=>items.push(b));
  const lnHtml=r=>{
    const tag=r.tag?`<span class="tag">${r.tag} п/г</span>`:"";
    const lbl=r.kind==="same"?"":`<div class="lbl ${r.kind}">${r.movedTo?`перенос на ${r.movedTo} пару`:r.moved?`перенос с ${r.moved} пары`:r.kind==="rep"?"замена":"подстановка"}</div>`;
    const was=r.old?`<div class="was">было: <s>${esc(r.old.subj)}${r.old.teacher?", "+esc(r.old.teacher):""}${r.old.room?", "+esc(r.old.room):""}</s></div>`:"";
    return`<div class="ln ${r.kind}"><div class="info">${lbl}<div class="s">${isNone(r.l)?"Пары нет":esc(r.l.subj)}${tag}</div>${r.l.teacher?`<div class="m">${esc(r.l.teacher)}</div>`:""}${was}</div>${r.l.room?`<div class="room">${esc(r.l.room)}</div>`:""}</div>`;
  };
  items.sort((a,b)=>pos(a)-pos(b)).forEach(it=>{
    if(it.name){
      const ev=document.createElement("div");ev.className="card ev";ev.style.animationDelay=(i++*50)+"ms";
      ev.innerHTML=`<div class="n"><span class="t">${it.s}<br>${it.e}</span></div><div class="s">${esc(it.name)}</div>`;
      list.appendChild(ev);return;
    }
    const el=document.createElement("div");el.className="card";el.style.animationDelay=(i++*50)+"ms";
    el.innerHTML=`<div class="n">${HIDE_NUMBERS.includes(selected.getDay())?"":it.p}${bell(it.p)}</div><div class="rows${it.rows.some(r=>r.kind!=="same")?" hl":""}">${it.rows.map(lnHtml).join("")}</div>`;
    list.appendChild(el);
  });
  if(!day.items.length)list.innerHTML=`<div class="empty">Пар нет 🎉</div>`;

  const f=$("foot");
  const when=changes?new Date(changes.updated).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):"";
  f.textContent=changes?(offline?`Нет сети — замены от ${when}, могли устареть`:`Замены обновлены: ${when}`):"Замены не загружены (сайт открыт без интернета или с компьютера как файл)";
}

document.querySelectorAll("#sg button").forEach(b=>b.onclick=()=>{subgroup=+b.dataset.v;localStorage.setItem("sg",subgroup);render()});

function shiftWeek(n){const d=new Date(selected);d.setDate(d.getDate()+7*n);selected=d;render()}
$("prev").onclick=()=>shiftWeek(-1);
$("next").onclick=()=>shiftWeek(1);
$("todayBtn").onclick=()=>{selected=new Date(today);if(selected.getDay()===0)selected.setDate(selected.getDate()+1);render()};

let x0=null;
document.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
document.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)<60)return;const d=new Date(selected);do{d.setDate(d.getDate()+(dx<0?1:-1))}while(d.getDay()===0);selected=d;render()});

render();
fetch("changes.json?"+Date.now()).then(r=>{offline=r.headers.get("x-from-cache")==="1";return r.json()}).then(j=>{changes=j;render()}).catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{}); // работа без интернета
</script>
<div style="text-align:center;margin-top:10px"><a id="spooky" style="font-size:11px;color:#bbb;cursor:pointer">© 2026</a></div>
<div id="dark" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99"></div>
<img id="scr" src="scream.png" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:100">
<audio id="snd" src="scream.ogg" preload="auto"></audio>
<style>@keyframes shake{0%,100%{transform:translate(0)scale(1.05)}25%{transform:translate(-15px,10px)scale(1.1)}75%{transform:translate(15px,-10px)scale(1.1)}}</style>
<script>
(()=>{let n=0;const a=document.getElementById("spooky"),d=document.getElementById("dark"),
img=document.getElementById("scr"),s=document.getElementById("snd");
a.onclick=()=>{n++;
  a.style.transform="translateX("+(n%2?2:-2)+"px)";setTimeout(()=>a.style.transform="",100);
  if(n<10)return; n=0;
  s.play().then(()=>{s.pause();s.currentTime=0}).catch(()=>{});
  d.style.pointerEvents="auto";d.style.opacity="0.8";
  setTimeout(()=>{
    img.style.display="block";img.style.animation="shake .1s infinite";

  },4000);

 const close=()=>{img.style.display="none";d.style.opacity="0";d.style.pointerEvents="none";s.pause();s.currentTime=0};
};})();
